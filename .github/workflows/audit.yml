name: Audit

# An advisory published after main last went green would otherwise first fail an unrelated pull
# request; this run reports it to Slack instead.
on:
  schedule:
    - cron: '17 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same steps as the CI audit job, which explains them.
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable corepack
        run: corepack enable
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  notify-audit-failure:
    name: Notify audit failure
    needs: [audit]
    if: ${{ always() && needs.audit.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Mirrors notify-ci-failure in ci.yml, which explains it.
      - name: Compose the message
        env:
          RESULT: ${{ needs.audit.result }}
        run: |
          case "${RESULT}" in
            cancelled) icon=":warning:" ;;
            *) icon=":x:" ;;
          esac
          case "${GITHUB_EVENT_NAME}" in
            schedule) trigger="scheduled" ;;
            *) trigger="manual" ;;
          esac
          ref=$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' <<<"${GITHUB_REF_NAME}")
          text="${icon} *${GITHUB_REPOSITORY}* ${trigger} audit of ${ref}: ${RESULT} — <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|run>"
          jq --null-input --arg text "${text}" '{text: $text}' > "${RUNNER_TEMP}/slack-payload.json"

      - name: Post to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
          errors: true
