name: Build image
description: Builds one app's production image into the local Docker daemon.

# Used by ci.yml's operations build; ci.yml builds the four server images through
# docker/docker-bake.hcl instead. It loads the image into the local daemon and never pushes, so
# the caller can smoke-test and scan it first; on a push to main, publish-images.yml then pushes
# that image.

inputs:
  app:
    description: The app to build; also the APP build arg.
    required: true
  target:
    description: The Dockerfile stage — api, web or operations.
    required: true
  tags:
    description: Tags to apply, one per line.
    required: true
  labels:
    description: OCI labels, one per line.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build ${{ inputs.app }}
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: docker/Dockerfile
        target: ${{ inputs.target }}
        build-args: APP=${{ inputs.app }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        # Into the local daemon, not a registry.
        load: true
        push: false
        # The docker exporter that `load` uses cannot carry buildx attestations; if asked for
        # them, buildx warns and drops them.
        provenance: false
