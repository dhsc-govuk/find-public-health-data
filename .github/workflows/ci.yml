name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede pull request runs — two quick merges must not leave main without a green run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash -eo pipefail, where an unnamed shell is bash -e alone: a failed command on the left of a
# pipe, such as the docker save that feeds an image archive, must fail the step.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # `biome ci` covers the same ground as the `biome check .` in `pnpm check` (format + lint +
      # import order) but never writes and annotates the diff. `pnpm lint` is lint only, so it would
      # let formatting drift onto main ungated.
      - run: pnpm exec biome ci .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Not `pnpm test`, which chains unit and integration; each tier is its own job here.
      - run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          POSTGRES_DB: fphd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fphd -d fphd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # Runs the image's default command; a service container cannot override it.
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        ports:
          - 10000:10000
        options: >-
          --health-cmd "nc -z 127.0.0.1 10000"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # The grant migrations reference the per-API roles, so they must exist before the global
      # setup migrates the template databases. Same command locally (`pnpm db:bootstrap`) and
      # in a deployed environment — this is the only bootstrap path.
      - name: Create the per-API login roles
        run: pnpm --filter @fphd/operations cli db bootstrap
        env:
          APP_ENV: test
          DB_HOST: localhost
          POSTGRES_DB: fphd
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
      # One root Vitest run across every project, filtered to paths containing `integration.test`
      # (any extension) — it passes on --passWithNoTests, not because nothing ran. The global
      # setup builds a migrated, seeded template database; each test file copies it, so files
      # run in parallel against isolated databases.
      - run: pnpm test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: fphd
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
          # internal-api's config requires it at import; CI-only value, not a secret.
          SESSION_JWT_SECRET: ci-only-jwt-session-secret-at-least-32-bytes
          # Azurite's published development account; internal-api's config requires storage too.
          STORAGE_CONTAINER: uploads
          STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;

  # Each shard starts its own stack and runs its share of the suite; add shards as the suite grows.
  e2e:
    name: E2E tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [build-app-images, seed-database]
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # One shard's failures must not hide the state of the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      # Reads the version pnpm actually installed rather than re-parsing the catalog entry, so a
      # reformatted pnpm-workspace.yaml can't silently break the cache key.
      - name: Read the installed Playwright version
        id: playwright-version
        run: |
          version=$(pnpm --filter @fphd/e2e exec playwright --version | sed -E 's/^Version //')
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}

      # Skips the download on a cache hit but still installs the OS packages, which
      # live outside the cached directory.
      - name: Install Chromium
        run: pnpm --filter @fphd/e2e exec playwright install --with-deps chromium

      - name: Download the app images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-images
          path: ${{ runner.temp }}

      - name: Load the app images
        run: zstd --decompress --stdout "${RUNNER_TEMP}/app-images.tar.zst" | docker load

      # The production images build-app-images built, smoke-tested and saved, so the suite runs
      # against the artefact scan-app-images scans. compose.e2e.yaml swaps each service's build
      # for its image; the healthchecks make --wait a real readiness gate. APP_ENV=test rather
      # than local so the TLS-to-database default stays off (isDeployedEnv is false for both)
      # while container logs stay JSON.
      - name: Start the stack
        env:
          APP_ENV: test
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          POSTGRES_DB: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
          # internal-web and internal-api must share it for sessions to verify; CI-only
          # value, not a secret.
          SESSION_JWT_SECRET: ci-only-jwt-session-secret-at-least-32-bytes
          WEB_SESSION_SECRET: ci-only-web-session-secret-at-least-32-bytes
        run: >
          docker compose -f compose.yaml -f compose.e2e.yaml
          --profile public-web --profile internal-web
          --profile public-api --profile internal-api
          up --detach --wait

      - name: Download the seeded database
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seeded-database
          path: ${{ runner.temp }}

      # seed-database's dump, into the compose database. The login roles come first: the dump
      # grants to them, but they belong to the server, not the database, so it cannot carry them.
      - name: Restore the seeded database
        env:
          APP_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: fphd
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
        run: |
          pnpm db:bootstrap
          docker exec --interactive fphd-postgres \
            pg_restore --username=fphd --dbname=fphd --exit-on-error --single-transaction \
            < "${RUNNER_TEMP}/seeded-database.dump"

      - name: Run the e2e tests
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm test:e2e --shard="${SHARD}"

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report

  # Per-route work budgets, checked against tools/perf/baseline.json. Counts rather than timings:
  # the SQL statements, database pages and rows each route costs, and its response size, which do
  # not drift with runner noise. Time is only checked against generous absolute limits. Beside
  # e2e on the same images, so it adds nothing to the pull request's critical path.
  performance:
    name: Route budgets
    needs: [build-app-images, seed-database]
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Download the app images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-images
          path: ${{ runner.temp }}

      - name: Load the app images
        run: zstd --decompress --stdout "${RUNNER_TEMP}/app-images.tar.zst" | docker load

      # As e2e starts it, plus compose.perf.yaml's database settings.
      - name: Start the stack
        env:
          APP_ENV: test
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          POSTGRES_DB: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
          # internal-web and internal-api must share it for sessions to verify; CI-only
          # value, not a secret.
          SESSION_JWT_SECRET: ci-only-jwt-session-secret-at-least-32-bytes
          WEB_SESSION_SECRET: ci-only-web-session-secret-at-least-32-bytes
        run: >
          docker compose -f compose.yaml -f compose.e2e.yaml -f compose.perf.yaml
          --profile public-web --profile internal-web
          --profile public-api --profile internal-api
          up --detach --wait

      - name: Download the seeded database
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seeded-database
          path: ${{ runner.temp }}

      # seed-database's dump, into the compose database. The login roles come first: the dump
      # grants to them, but they belong to the server, not the database, so it cannot carry them.
      - name: Restore the seeded database
        env:
          APP_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: fphd
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
        run: |
          pnpm db:bootstrap
          docker exec --interactive fphd-postgres \
            pg_restore --username=fphd --dbname=fphd --exit-on-error --single-transaction \
            < "${RUNNER_TEMP}/seeded-database.dump"

      - name: Check the route budgets
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: fphd
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
        run: pnpm check:perf --measured "${RUNNER_TEMP}/perf-baseline/baseline.json"

      # Always, so `pnpm perf:accept <run-id>` can adopt a run's numbers whether it passed or not.
      - name: Upload the measured numbers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-baseline
          path: ${{ runner.temp }}/perf-baseline/baseline.json
          retention-days: 30
          if-no-files-found: ignore

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable corepack
        run: corepack enable
      # pnpm audit resolves the tree from pnpm-lock.yaml, so this job never installs — and so the
      # job that hunts for malicious dependencies never executes one. (Every installing job runs
      # esbuild's postinstall, per `allowBuilds` in pnpm-workspace.yaml.)
      # Deliberately no --ignore-registry-errors: a registry outage must redden the gate rather than
      # silently pass it.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # `gitleaks git` walks history; a shallow clone hides it
      # The CLI, not gitleaks-action, which wants a licence key for org-owned repos.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
      # --redact keeps hits out of the log, which anyone can read on a public repo.
      # HEAD only: by default gitleaks scans every fetched branch, other pull requests' included.
      - name: Scan git history
        run: gitleaks git . --redact --verbose --log-opts=HEAD

  # Distinct from `compile`, which only proves the workspace builds. This proves the artefact that
  # actually ships assembles and starts: `pnpm deploy --prod --legacy` prunes devDependencies, so a
  # module imported at runtime but declared as a devDependency compiles here and is missing there.
  # The smoke test catches that at startup; the e2e job, which runs these images, catches it in a
  # route handler.
  #
  # No registry login: the images are built into the local daemon, then saved as an artifact for
  # e2e and scan-app-images, and on a push to main for publish-images.yml, which pushes these
  # bytes. One bake invocation so the shared builder stage runs once and the four app builds run
  # in parallel. No build cache: every layer after `COPY . .` misses on a pull request anyway,
  # exporting it costs more time than it restores, and a published image is then made only of
  # layers this run built.
  build-app-images:
    name: Build app images
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The one label value the run's context cannot supply.
      - name: Read the build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      # `source: .` builds the checkout; the default is a Git context fetched by BuildKit. The
      # OCI_ variables fill in docker-bake.hcl's labels: commit and build-time metadata go in the
      # labels, not the tags, where they could drift from what the labels say.
      - name: Build the app images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          OCI_REVISION: ${{ github.sha }}
          OCI_CREATED: ${{ steps.timestamp.outputs.created }}
        with:
          source: .
          files: docker/docker-bake.hcl
          load: true
          provenance: false

      - name: Smoke test the app images
        run: |
          for app in public-web internal-web public-api internal-api; do
            scripts/smoke-image.sh "${app}" "fphd-ci/${app}:ci"
          done

      - name: Check the app images' contents
        run: |
          for app in public-web internal-web public-api internal-api; do
            scripts/check-image-contents.sh "${app}" "fphd-ci/${app}:ci"
          done

      # One archive for all four so the base layers they share are stored once. zstd rather than
      # the artifact's own zip compression, which is slower for the same size.
      - name: Save the app images
        run: >
          docker save
          fphd-ci/public-web:ci fphd-ci/internal-web:ci
          fphd-ci/public-api:ci fphd-ci/internal-api:ci
          | zstd -T0 -3 -o "${RUNNER_TEMP}/app-images.tar.zst"

      - name: Upload the app images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-images
          path: ${{ runner.temp }}/app-images.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Alongside e2e rather than before it, so a scan never holds up the suite.
  scan-app-images:
    name: Scan images (${{ matrix.app }})
    needs: [build-app-images, trivy-db]
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # One image's findings must not mask the state of the other three.
      fail-fast: false
      matrix:
        app: [public-web, internal-web, public-api, internal-api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the app images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-images
          path: ${{ runner.temp }}

      - name: Load the app images
        run: zstd --decompress --stdout "${RUNNER_TEMP}/app-images.tar.zst" | docker load

      - name: Scan ${{ matrix.app }}
        uses: ./.github/actions/scan-image
        with:
          image-ref: fphd-ci/${{ matrix.app }}:ci
          db-cache-key: ${{ needs.trivy-db.outputs.cache-key }}

  # Brings Trivy's vulnerability database up to date once a run and caches it under its update
  # time; each of the five scans restores that copy and skips the update, or downloads its own if
  # the restore fails. It starts from the newest copy cached before, so Trivy downloads only when
  # that copy is out of date.
  trivy-db:
    name: Update the Trivy database
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-trivy

      - name: Restore the newest cached database
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          # Never saved, so restore-keys picks the newest copy.
          key: trivy-db-newest
          restore-keys: trivy-db-

      - name: Make an empty directory to scan
        run: mkdir "${RUNNER_TEMP}/empty"

      # A vulnerability scan of an empty directory: Trivy updates the database before it reads
      # the target, then finds nothing in it.
      - name: Update the database
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/empty
          scanners: vuln
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
          skip-setup-trivy: 'true'

      - name: Key the database by its update time
        id: key
        run: |
          updated=$(jq --raw-output --exit-status .UpdatedAt "${RUNNER_TEMP}/trivy-cache/db/metadata.json")
          echo "key=trivy-db-${updated}" >> "${GITHUB_OUTPUT}"

      - name: Cache the database
        if: ${{ steps.key.outputs.key != steps.restore.outputs.cache-matched-key }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ steps.key.outputs.key }}

  # Build, smoke test, check and scan, as build-app-images and scan-app-images do for the app
  # images. On its own because e2e does not run it. On a push to main it saves the image for
  # publish-images.yml. No build cache, as for the app images: exporting it cost more time than
  # it restored.
  build-operations-image:
    name: Build image (operations)
    needs: trivy-db
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one label value the run's context cannot supply.
      - name: Read the build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      # The same labels docker-bake.hcl gives the app images.
      - name: Build operations
        uses: ./.github/actions/build-image
        with:
          app: operations
          target: operations
          tags: fphd-ci/operations:ci
          labels: |
            org.opencontainers.image.title=fphd-operations
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.created }}
            org.opencontainers.image.licenses=MIT

      - name: Smoke test operations
        run: scripts/smoke-image.sh operations fphd-ci/operations:ci

      - name: Check operations' contents
        run: scripts/check-image-contents.sh operations fphd-ci/operations:ci

      # After the smoke test, so a scan finding never masks an image that fails to start.
      - name: Scan operations
        uses: ./.github/actions/scan-image
        with:
          image-ref: fphd-ci/operations:ci
          db-cache-key: ${{ needs.trivy-db.outputs.cache-key }}

      - name: Save operations
        if: ${{ github.event_name == 'push' }}
        run: docker save fphd-ci/operations:ci | zstd -T0 -3 -o "${RUNNER_TEMP}/operations-image.tar.zst"

      - name: Upload operations
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operations-image
          path: ${{ runner.temp }}/operations-image.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Seeds a database once a run and saves a dump of it, which e2e and Route budgets restore
  # rather than each seeding their own. Beside build-app-images, so it adds nothing to the pull
  # request's critical path.
  seed-database:
    name: Seed the database
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          POSTGRES_DB: fphd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fphd -d fphd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      # The same commands a developer runs.
      - name: Seed the database
        env:
          APP_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: fphd
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
        run: pnpm db:bootstrap && pnpm db:migrate && pnpm db:import-core-data && pnpm db:seed-dummy-data

      # pg_dump inside the service container, so the client is the server's version. The custom
      # format is compressed already. --statistics keeps the planner statistics the seed's ANALYZE
      # of the read models wrote, which pg_dump leaves out by default.
      - name: Dump the database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >
          docker exec "${POSTGRES_CONTAINER}" pg_dump --format=custom --statistics --username=fphd fphd
          > "${RUNNER_TEMP}/seeded-database.dump"

      - name: Upload the dump
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seeded-database
          path: ${{ runner.temp }}/seeded-database.dump
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  artefact-boundary:
    name: Public artefact boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Builds the public artefacts itself, so the check runs standalone from a clean tree. The only
      # workspace build outside Docker; build-app-images builds the whole workspace inside it.
      - run: pnpm check:artefacts

  # A schema change without its migration: drizzle-kit, run against a copy of the migrations,
  # would write one. Needs no database.
  migration-drift:
    name: Migrations match the schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm check:migrations

  e2e-coverage:
    name: E2E route coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Reads the route tables and the spec directories; needs neither a build nor the stack.
      - run: pnpm check:e2e-coverage

  # The gap the route check cannot see is new behaviour on an existing page, so a pull request
  # that changes web code (the web apps, their feature packages, or the shared UI package)
  # without touching a spec fails here until it is labelled
  # `no-e2e-needed` with a "No e2e needed: <reason>" line in its body. Blunt by design: the
  # override is cheap, and the reason sits in front of the reviewer. Labels and body are read
  # live rather than from the event payload, so adding them and re-running this job is enough.
  web-changes-need-e2e:
    name: Web changes carry e2e changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Nothing to check on a push to main; the job still reports success so the gate stays green.
      - name: Check the changed files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if ! grep -Eq '^(apps/[^/]+-web|packages/[^/]+-web-features|packages/(ui|utils|web-server|auth))/' <<<"${files}"; then
            echo 'No web code changed.'
            exit 0
          fi
          if grep -q '^e2e/' <<<"${files}"; then
            echo 'Web code changed alongside e2e changes.'
            exit 0
          fi
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          if ! jq -e '.labels | any(.name == "no-e2e-needed")' <<<"${pr}" >/dev/null; then
            echo '::error::Web code changed without any change under e2e/. Add or extend a spec, or label the pull request no-e2e-needed, add a "No e2e needed: <reason>" line to its body, and re-run this job.'
            exit 1
          fi
          reason=$(jq -r '.body // ""' <<<"${pr}" | tr -d '\r' | grep -E '^No e2e needed: *[^[:space:]]' | head -1 || true)
          if [ -z "${reason}" ]; then
            echo '::error::The no-e2e-needed label needs a "No e2e needed: <reason>" line in the pull request body.'
            exit 1
          fi
          echo "${reason}"

  all-checks-pass:
    name: All checks pass
    # The required status check in branch protection for every job in this workflow; pr-body.yml's
    # jobs are required separately. Add every new job here — the gate can only report on what it
    # depends on.
    needs:
      [
        lint,
        typecheck,
        unit,
        integration,
        e2e,
        performance,
        audit,
        secrets,
        build-app-images,
        scan-app-images,
        trivy-db,
        build-operations-image,
        seed-database,
        artefact-boundary,
        migration-drift,
        e2e-coverage,
        web-changes-need-e2e,
      ]
    # `always()` so a failing need reddens the gate rather than skipping it — GitHub reports a
    # skipped required check as satisfied, so the default `success()` would stop the gate blocking
    # exactly when it matters.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Passed through env rather than interpolated into the shell body: `needs.*.result` is a
      # trusted enumerated value, but inlining `${{ }}` in `run:` is the habit that goes wrong the
      # day it is copied to an untrusted one.
      - name: Check upstream results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream results: ${RESULTS}"
          if [ -z "${RESULTS}" ]; then
            echo '::error::The gate depends on no jobs; nothing was verified.'
            exit 1
          fi
          for result in ${RESULTS}; do
            if [ "${result}" != 'success' ]; then
              echo '::error::A required check did not succeed.'
              exit 1
            fi
          done

  # On a push to main once every check has passed, publishes the images this run built and
  # tested. After the gate rather than in its needs, so a commit with a failing check publishes
  # nothing. A called workflow gets no more permissions than its caller job grants.
  publish-images:
    name: Publish images
    needs: [all-checks-pass]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: ./.github/workflows/publish-images.yml
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Runs only on push to main: the webhook secret must never be available to
  # pull_request jobs. Not in all-checks-pass's needs — it gates nothing, and
  # would sit skipped (not success) on the runs the gate checks.
  notify-ci-failure:
    name: Notify CI failure
    needs: [all-checks-pass]
    # Success is silent — a green run on main is the expected state, and the
    # publish jobs post the message that marks the commit landing.
    if: ${{ always() && github.event_name == 'push' && needs.all-checks-pass.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Through env and jq, never interpolated: the text carries the commit message.
      - name: Compose the message
        env:
          RESULT: ${{ needs.all-checks-pass.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case "${RESULT}" in
            cancelled) icon=":warning:" ;;
            *) icon=":x:" ;;
          esac
          subject=${COMMIT_MESSAGE%%$'\n'*}
          subject=$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' <<<"${subject}")
          text="${icon} *${GITHUB_REPOSITORY}* CI on main: ${RESULT} — ${subject} — <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|run>"
          jq --null-input --arg text "${text}" '{text: $text}' > "${RUNNER_TEMP}/slack-payload.json"

      - name: Post to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
          # Fail the job if the post fails — a silent channel must not look healthy.
          errors: true
