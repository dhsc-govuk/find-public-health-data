version: 2
updates:
  # Actions are pinned to commit SHAs, which do not update themselves — pinning without Dependabot
  # would leave them frozen and unpatched. Dependabot rewrites the SHA and its `# vX.Y.Z` comment
  # together. `directory: /` covers both workflows/ and actions/.
  #
  # The npm ecosystem is deliberately absent: dependency versions live in the `catalog:` in
  # pnpm-workspace.yaml, which Dependabot does not reliably understand. The audit job covers the
  # security case.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  # Same reasoning one layer down: docker/Dockerfile pins its base image by digest, which never
  # moves on its own. The runtime stage runs `apk upgrade` at build time, so a stale base no
  # longer fails the publish scan; weekly keeps the pin moving anyway — a fresh base keeps the
  # upgrade delta small, and it is the only route to a newer Node. A bump that moves Node fails
  # CI until the same pull request updates .nvmrc to match. app.Dockerfile sits in the same
  # directory but tracks a tag, so there is nothing in it to raise.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - '*'
    commit-message:
      prefix: build
