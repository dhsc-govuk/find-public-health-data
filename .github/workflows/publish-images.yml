name: Publish images

# Called by ci.yml on a push to main once the All checks pass job has succeeded, so a commit
# whose CI fails publishes nothing. It pushes the images that run built, smoke-tested and scanned,
# and for the four servers ran e2e against, so the deployed bytes are the tested bytes. A called
# workflow rather than one triggered by workflow_run, which would run against main's latest
# commit rather than the one CI tested: the infrastructure repo verifies each image's provenance
# against this file as the signer, refs/heads/main as the ref and the image's commit.
on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

permissions:
  contents: read

# Never cancels: two quick merges must queue rather than race, or `latest` can end up
# pointing at the older of the two. ci.yml's runs on main queue too, so they call this in order.
concurrency:
  group: publish-images
  cancel-in-progress: false

# bash -eo pipefail, where an unnamed shell is bash -e alone: a failed command on the left of a
# pipe must fail the step.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The run's own GITHUB_TOKEN is the whole of the auth: no PAT, no stored secret,
      # and the token expires with the run. The same token signs the provenance, through
      # the run's OIDC identity; no signing key exists anywhere.
      packages: write
      id-token: write
      attestations: write
    strategy:
      # One app failing to push must not stop the other four publishing.
      fail-fast: false
      matrix:
        include:
          - app: public-web
            artifact: app-images
          - app: internal-web
            artifact: app-images
          - app: public-api
            artifact: app-images
          - app: internal-api
            artifact: app-images
          - app: operations
            artifact: operations-image
    steps:
      # Derived from the run so the workflow publishes under whichever repository it is in.
      # Repo-prefixed so a generic name like `operations` isn't loose in the organisation
      # namespace, and `fphd-` prefixed so the five group together in the organisation's package
      # list; lowercased because image references must be and an owner or repository name need
      # not be. The packages are linked to that repository and inherit its permissions because
      # their first push comes from this workflow's token — the prefixes alone do nothing. They
      # are public, so deployments pull anonymously. GHCR does not reliably create a new package
      # public, so check a new one's visibility after its first push.
      - name: Derive the image name from this repository
        env:
          APP: ${{ matrix.app }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/fphd-${APP}" >> "${GITHUB_ENV}"

      - name: Download the image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}

      - name: Load the image
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: zstd --decompress --stdout "${RUNNER_TEMP}/${ARTIFACT}.tar.zst" | docker load

      # ci.yml labels the images with the commit it built. The infrastructure repo reads the label
      # to find the commit behind `latest`, so an image without it, or with another commit's,
      # must not be pushed.
      - name: Tag the image, if it is this commit's
        env:
          APP: ${{ matrix.app }}
        run: |
          revision=$(docker image inspect "fphd-ci/${APP}:ci" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          if [ "${revision}" != "${GITHUB_SHA}" ]; then
            echo "::error::fphd-ci/${APP}:ci is labelled with revision '${revision}', not ${GITHUB_SHA}"
            exit 1
          fi
          docker tag "fphd-ci/${APP}:ci" "${IMAGE}:${GITHUB_SHA}"
          docker tag "fphd-ci/${APP}:ci" "${IMAGE}:latest"

      - name: Sign in to the container registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GITHUB_TOKEN}"

      # No build, smoke test, contents check or scan here: the calling run did all four to these
      # bytes before the All checks pass job succeeded.
      #
      # Both tags are labels for humans, not what a deployment should reference: GHCR tags are
      # mutable. The digest below is the immutable reference. `latest` is pushed last, below.
      - name: Push the image
        id: push
        run: |
          # `docker push` reports the manifest the registry stored as `<tag>: digest: sha256:…`.
          # Read it from the push rather than from the local image: it is the registry's own
          # answer to what now exists under this tag. pipefail, from the default shell, fails
          # the step when the push fails, so `latest` never moves.
          push_output=$(docker push "${IMAGE}:${GITHUB_SHA}" | tee /dev/stderr)

          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' <<<"${push_output}" | head -1)
          if [ -z "${digest}" ]; then
            echo '::error::Could not read the pushed manifest digest'
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "reference=${IMAGE}@${digest}" >> "${GITHUB_OUTPUT}"

      # Build provenance for the digest just pushed, signed with this run's OIDC identity and
      # stored both in this repository's attestations and in the registry beside the image.
      # The infrastructure repo's deploy and db-ops workflows verify it before pinning a digest,
      # so an image without one does not deploy.
      - name: Attest the image
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # After the attestation, so `latest` never names an image the deploy workflows would refuse.
      # It only moves forward: re-running an older commit's CI on main publishes its SHA tag again
      # but leaves `latest` on a newer commit. The current revision is read from the label the
      # infrastructure repo reads; an image without one, or no `latest` yet, is replaced. Only a
      # missing tag counts as no `latest`: any other inspect error, such as the registry being
      # unavailable, fails the step rather than risk moving `latest` back. The package exists by
      # now, since the SHA tag was pushed above.
      - name: Move latest forward
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if inspected=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Image}}' \
            2> "${RUNNER_TEMP}/inspect-latest.err"); then
            current=$(jq --raw-output '.config.Labels["org.opencontainers.image.revision"] // empty' \
              <<<"${inspected}")
          elif grep --quiet --fixed-strings "${IMAGE}:latest: not found" "${RUNNER_TEMP}/inspect-latest.err"; then
            current=''
          else
            cat "${RUNNER_TEMP}/inspect-latest.err" >&2
            exit 1
          fi
          if [ -n "${current}" ] && [ "${current}" != "${GITHUB_SHA}" ]; then
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current}...${GITHUB_SHA}" --jq .status)
            if [ "${status}" != ahead ]; then
              echo "::notice::latest stays on ${current}: ${GITHUB_SHA} is not ahead of it (${status})"
              exit 0
            fi
          fi
          docker push "${IMAGE}:latest"

      # Deploys are manual for now; the run summary puts the digest where a person can find
      # it without digging through logs.
      - name: Record the deployable reference
        env:
          APP: ${{ matrix.app }}
          REFERENCE: ${{ steps.push.outputs.reference }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            echo "### ${APP}"
            echo
            echo '```'
            echo "${REFERENCE}"
            echo '```'
            echo
            echo "[Build provenance](${ATTESTATION_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"

  # One Slack message per run, never one per matrix leg. Per-app conclusions come
  # from the jobs API because needs.publish.result collapses the matrix to one
  # value — and the partial publish (fail-fast: false) is the case worth spelling
  # out, since the registry is then a mixed set under `latest`. The API can lag
  # the run, reporting a finished leg's conclusion as null, so the step waits for
  # it and then falls back on needs.publish.result. The API names a called
  # workflow's jobs after the caller's job too: `Publish images / Publish public-web`.
  notify:
    name: Notify publish outcome
    needs: [publish]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # For reading this run's jobs.
      actions: read
    steps:
      # Through env and jq, never interpolated: the text carries the commit message.
      - name: Compose the message
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | test("(^|/ )Publish [^/]+$")) | {app: (.name | sub("^.*Publish "; "")), conclusion}]')
            if ! jq --exit-status 'length == 0 or any(.[]; .conclusion == null)' <<<"${jobs}" > /dev/null; then
              break
            fi
            if [ "${attempt}" -lt 6 ]; then
              sleep 5
            fi
          done
          # needs.publish.result is success only when every leg succeeded, so it settles a
          # leg the API never reported; any other result leaves that leg unknown.
          if [ "${PUBLISH_RESULT}" = success ]; then
            fallback=success
          else
            fallback=unknown
          fi
          jobs=$(jq --arg fallback "${fallback}" 'map(.conclusion //= $fallback)' <<<"${jobs}")
          total=$(jq length <<<"${jobs}")
          published=$(jq '[.[] | select(.conclusion == "success")] | length' <<<"${jobs}")
          unknown=$(jq '[.[] | select(.conclusion == "unknown")] | length' <<<"${jobs}")
          if [ "${total}" -eq 0 ]; then
            echo '::error::found no publish jobs in this run'
            exit 1
          fi
          if [ "${published}" -eq "${total}" ]; then
            headline=":white_check_mark: Published all ${total} images"
          elif [ "${unknown}" -gt 0 ]; then
            headline=":warning: Publish ${PUBLISH_RESULT} — ${published}/${total} confirmed published"
          elif [ "${published}" -eq 0 ]; then
            headline=":x: Publish failed — no images pushed"
          else
            headline=":warning: PARTIAL publish (${published}/${total})"
          fi
          # Short of all published, a leg failed: any confirmed publish mixes `latest`, an unknown leg may.
          mixed=''
          if [ "${published}" -gt 0 ] && [ "${published}" -lt "${total}" ]; then
            mixed=" — \`latest\` is now a mixed set"
          elif [ "${unknown}" -gt 0 ]; then
            mixed=" — \`latest\` may be a mixed set"
          fi
          subject=${COMMIT_MESSAGE%%$'\n'*}
          subject=$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' <<<"${subject}")
          text="${headline} for \`${GITHUB_SHA}\` ${subject}${mixed} — <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|run>"
          text+=$'\n'"$(jq -r '.[] | "• \(.app): \(.conclusion)"' <<<"${jobs}")"
          jq --null-input --arg text "${text}" '{text: $text}' > "${RUNNER_TEMP}/slack-payload.json"

      - name: Post to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
          # Fail the job if the post fails — a silent channel must not look healthy.
          errors: true
