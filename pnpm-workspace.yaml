packages:
  - apps/*
  - packages/*
  - tools/*
  - e2e

# Supply-chain guard: a version must be this old (minutes: 3 days) before pnpm resolves it or
# installs it from the lockfile, transitive dependencies included. A deliberately fresh version is
# listed in minimumReleaseAgeExclude as name@version and removed once it has aged past the window.
# NotGovUK and react-foundry are excluded permanently (README, "Continuous integration").
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - '@not-govuk/*'
  - '@react-foundry/*'

overrides:
  # FIXME: remove once Azure Identity permits patched MSAL; GHSA-xcx6-jx8p-x3h5 affects its v6 dependency.
  '@azure/identity>@azure/msal-node': 7.1.1
  # GHSA-67mh-4wv8-2f99 esbuild <=0.24.2 dev server answers any origin. Transitive via
  # drizzle-kit's deprecated @esbuild-kit loader, which pins ~0.18 and was merged into tsx, so
  # no fixed release is coming. Scoped so drizzle-kit's and tsx's own esbuild stay untouched.
  '@esbuild-kit/core-utils>esbuild': '>=0.24.3 <0.26'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  fsevents: true

