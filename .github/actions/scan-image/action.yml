name: Scan image
description: Trivy scans a built image — OS vulnerabilities, then secrets — and fails on findings.

# ci.yml's scans, of the app images and of operations. The trivy action rather than a trivy image
# so the engine sits under Dependabot's actions updater; pinning `version:` would undo that.

inputs:
  image-ref:
    description: The image reference to scan.
    required: true
  db-cache-key:
    description: >-
      The cache key ci.yml's trivy-db job saved the vulnerability database under, this run.
    required: true

runs:
  using: composite
  steps:
    # The database trivy-db brought up to date for this run, so no scan downloads its own. The
    # action's own cache is keyed by date, and a copy saved earlier the same day can already be out
    # of date to Trivy, which then downloads it again.
    - name: Restore the vulnerability database
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-cache
        key: ${{ inputs.db-cache-key }}
        fail-on-cache-miss: true

    # OS packages only: the npm tree is already audited from the lockfile in CI, and scanning
    # it here would fail on npm's own bundled dependencies — which nothing in these images runs
    # and only a new base image fixes. ignore-unfixed because a CVE with no fix yet is a red
    # build with nothing to do about it but wait.
    - name: Scan for vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln
        # The action has not renamed this input yet; it sets TRIVY_PKG_TYPES.
        vuln-type: os
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: 1
        cache: 'false'
        cache-dir: ${{ runner.temp }}/trivy-cache
      env:
        TRIVY_SKIP_DB_UPDATE: 'true'

    # The images are public, so a secret in a layer is published. A separate step because the
    # vulnerability scan's HIGH,CRITICAL floor would hide Trivy's generic credential patterns.
    # check:artefacts already blocks the route in; this checks the bytes.
    - name: Scan for secrets
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        scanners: secret
        exit-code: 1
        cache: 'false'
        cache-dir: ${{ runner.temp }}/trivy-cache
        # The step above put Trivy on the path.
        skip-setup-trivy: 'true'
      env:
        # Build args and ENV land in the image config, not in a file; the default scan reads files only.
        TRIVY_IMAGE_CONFIG_SCANNERS: secret
