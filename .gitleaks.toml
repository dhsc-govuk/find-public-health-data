# The default rules, a rule for email addresses, and allowlists for values that are published rather
# than secret.
[extend]
useDefault = true

[[allowlists]]
description = "Azurite's development account key, published in Microsoft's documentation"
regexTarget = "line"
regexes = ['''AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''']

[[allowlists]]
description = "A unit's UUID beside \"£ per capita\": generic-api-key matches the \"api\" in \"capita\""
regexTarget = "line"
regexes = ['''\('£ per capita', '01a0d8a5-3ca2-7315-bfca-96e3aae4dc98'\)''']

# Personal data has no place in a public repo, so any email address fails the scan unless it is
# invented. Tests, fixtures and examples use example.com, example.org or example.net.
[[rules]]
id = "email-address"
description = "A real email address. Use an invented one at example.com, example.org or example.net."
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'''
keywords = ["@"]

[[rules.allowlists]]
description = "Domains reserved for examples and testing, and their subdomains"
regexes = [
  '''(?i)@(?:[a-z0-9-]+\.)*example\.(?:com|org|net)$''',
  '''(?i)\.(?:example|test|invalid|localhost)$''',
]

[[rules.allowlists]]
description = "A pnpm patch file name, package@version.patch, such as postgres@3.4.9.patch"
regexes = ['''@\d+\.\d+\.\d+[0-9A-Za-z.+-]*\.patch$''']

[[rules.allowlists]]
description = "GitHub's SSH user, as in a git@github.com clone URL"
regexes = ['''^git@github\.com$''']
