# Local development services. Not for production.
#
# `docker compose up` starts only the database and Azurite; the app services sit behind
# profiles matching their names, so they start only when asked for:
#   docker compose --profile public-api --profile public-web up -d --build
# scripts/dev.sh derives the profile set from whichever apps you run locally.
#
# One wiring rule keeps every local/container mix working: each app, local or
# containerised, is reachable on the host at its canonical port (3000/3001/4000/4001),
# and any URL by which one app reaches another is env-driven with a localhost default.
# A containerised app overrides such URLs with host.docker.internal:<port>, reaching
# whatever runs behind that port without knowing whether it's local or a container.
#
# Each service is given its environment inline rather than through a shared env_file, so a
# container receives only what its own app needs — public-api has no session secret because
# it verifies no sessions. The cost is that a newly required variable must be added here as
# well as to .env.example, and an app whose config schema gains one fails at startup until
# it is. The `:?` forms fail the compose command naming the missing variable, rather than
# starting a container that crashes on boot.
services:
  db:
    image: postgres:18.4
    container_name: fphd-postgres
    restart: unless-stopped
    environment:
      # Passwords have no default: a missing one fails the command rather than silently
      # creating a role with a well-known password. Copy .env.example to .env to get started.
      POSTGRES_USER: ${POSTGRES_USER:-fphd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-fphd}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images store data in a version-specific subdirectory, so the
      # volume mounts at /var/lib/postgresql (not the pre-18 /var/lib/postgresql/data).
      # No initdb scripts: the per-API login roles come from `pnpm db:bootstrap`, the same
      # path a managed server uses.
      - fphd-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fphd} -d ${POSTGRES_DB:-fphd}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Blob Storage emulator; its version is pinned with @azure/storage-blob in pnpm-workspace.yaml.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: fphd-azurite
    restart: unless-stopped
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data"]
    ports:
      - "${AZURITE_PORT:-10000}:10000"
    volumes:
      - fphd-azurite-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 5s
      retries: 5

  public-web:
    profiles: [public-web]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        APP: public-web
    container_name: fphd-public-web
    init: true
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in .env (see .env.example)}
      API_URL: http://host.docker.internal:4000
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/livez').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  internal-web:
    profiles: [internal-web]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        APP: internal-web
    container_name: fphd-internal-web
    init: true
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in .env (see .env.example)}
      API_URL: http://host.docker.internal:4001
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:?set SESSION_JWT_SECRET in .env (see .env.example)}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?set WEB_SESSION_SECRET in .env (see .env.example)}
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/livez').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  public-api:
    profiles: [public-api]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        APP: public-api
    container_name: fphd-public-api
    init: true
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in .env (see .env.example)}
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fphd}
      PUBLIC_API_PASSWORD: ${PUBLIC_API_PASSWORD:?set PUBLIC_API_PASSWORD in .env (see .env.example)}
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/livez').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  internal-api:
    profiles: [internal-api]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        APP: internal-api
    container_name: fphd-internal-api
    init: true
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in .env (see .env.example)}
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fphd}
      INTERNAL_API_PASSWORD: ${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD in .env (see .env.example)}
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:?set SESSION_JWT_SECRET in .env (see .env.example)}
      STORAGE_CONTAINER: ${STORAGE_CONTAINER:-uploads}
      # Azurite's published development account, reached by service name; not a secret.
      STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    ports:
      - "4001:4001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4001/livez').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # The worker publishes no port to the host. Its only routes are the /livez and /readyz probes,
  # and the healthcheck below calls /livez from inside the container.
  internal-worker:
    profiles: [internal-worker]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        APP: internal-worker
    container_name: fphd-internal-worker
    init: true
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in .env (see .env.example)}
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fphd}
      INTERNAL_API_PASSWORD: ${INTERNAL_API_PASSWORD:?set INTERNAL_API_PASSWORD in .env (see .env.example)}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4002/livez').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fphd-pgdata:
  fphd-azurite-data:
