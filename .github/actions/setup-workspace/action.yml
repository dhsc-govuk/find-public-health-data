name: Set up workspace
description: Installs the pinned Node and pnpm, restores the pnpm store, and installs dependencies.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node-pnpm

    # setup-node's own `cache: pnpm` needs pnpm on PATH before setup-node runs, which would mean
    # the runner's Node rather than the one .nvmrc names. So the store is cached here instead,
    # once pnpm is installed.
    - name: Find the pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
